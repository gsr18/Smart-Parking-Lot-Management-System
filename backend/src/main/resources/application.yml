spring:
  application:
    name: smart-parking-system
  profiles:
    active: dev
  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:mock-key-for-local-fallback}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7
  jackson:
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

server:
  port: 8080
  servlet:
    context-path: /

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

app:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250655368566D5971
    expiration-ms: 86400000 # 24 hours
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,https://gsr18.github.io,https://*.vercel.app,https://*.railway.app,https://*.onrender.com}"
    allowed-methods: "GET,POST,PUT,PATCH,DELETE,OPTIONS"
    allowed-headers: "*"
    allow-credentials: true
