spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:file:./data/smartparkingdb;MODE=MySQL;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 30000
      max-lifetime: 1800000
      leak-detection-threshold: 30000

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true

  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: ${SPRING_MAIL_HOST:smtp.gmail.com}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:simghgaurav001@gmail.com}
    password: ${SPRING_MAIL_PASSWORD:ystfkbxpocfoudol}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true

  ai:
    openai:
      api-key: ${SPRING_AI_OPENAI_API_KEY:mock-key}
      chat:
        options:
          model: gpt-4o-mini
          temperature: 0.7

logging:
  level:
    root: INFO
    com.smartparking: DEBUG
    org.springframework.mail: DEBUG
    org.springframework.orm.jpa: INFO
