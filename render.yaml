databases:
  - name: smartparking-db
    plan: free
    databaseName: smartparking
    user: smartparking

services:
  # 1. Spring Boot Backend Web Service
  - type: web
    name: smart-parking-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: smartparking-db
          property: connectionString

  # 2. React Frontend Static Site
  - type: web
    name: smart-parking-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: smart-parking-backend
          property: host

